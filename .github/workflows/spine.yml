name: Deterministic spine
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run fixture
      - run: node apps/mission-control/dist/cli.js artifacts/ci-run
      - run: node scripts/planning-evidence.mjs artifacts/ci-run/component-planning.json
      - run: node scripts/controller-evidence.mjs artifacts/ci-run/controller
      - run: node scripts/campaign.mjs run artifacts/ci-run/campaign
      - uses: actions/upload-artifact@v4
        with:
          name: spine-${{ matrix.os }}
          path: artifacts/ci-run/
          retention-days: 14
  compare:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/compare
      - run: npm ci
      - run: npm run build
      - run: node scripts/compare-runs.mjs artifacts/compare/spine-ubuntu-latest artifacts/compare/spine-windows-latest --planning --controller --campaign
      - run: node scripts/campaign.mjs replay artifacts/compare/spine-windows-latest/campaign artifacts/windows-replayed-on-linux
