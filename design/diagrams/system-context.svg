<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Open Prospector system context and component boundaries</title>
  <desc id="desc">Mission control sends a gatekeeper-cleared directive through a latency and bandwidth channel to an asset-side fleet endpoint. The endpoint plans locally using asset belief, autonomy, body, and sensors. A frozen simulated truth exists only inside the Rung-0 simulation boundary. Status and evidence return through the channel and update mission control's received belief. Observer-scoped projections feed interactive and Blender renderers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="arrow-head-purple"/>
    </marker>
    <style>
      .title { font: 500 24px system-ui, sans-serif; fill: #0f172a; }
      .group-title { font: 500 16px system-ui, sans-serif; fill: #334155; }
      .label { font: 500 14px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 12px system-ui, sans-serif; fill: #475569; text-anchor: middle; }
      .edge-label { font: 500 12px system-ui, sans-serif; fill: #475569; text-anchor: middle; }
      .group { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
      .mission { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .asset { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
      .sim { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .record { fill: #ffedd5; stroke: #ea580c; stroke-width: 1.5; }
      .neutral { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .channel { fill: #fef9c3; stroke: #ca8a04; stroke-width: 2; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .asset-flow { fill: none; stroke: #7c3aed; stroke-width: 2; marker-end: url(#arrow-purple); }
      .provision { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .truth-line { fill: none; stroke: #16a34a; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .arrow-head { fill: #64748b; }
      .arrow-head-purple { fill: #7c3aed; }
      @media (prefers-color-scheme: dark) {
        .title { fill: #f8fafc; }
        .group-title { fill: #cbd5e1; }
        .label { fill: #f8fafc; }
        .small, .edge-label { fill: #cbd5e1; }
        .group { stroke: #64748b; }
        .mission { fill: #0c4a6e; stroke: #38bdf8; }
        .asset { fill: #4c1d95; stroke: #a78bfa; }
        .sim { fill: #14532d; stroke: #4ade80; }
        .record { fill: #7c2d12; stroke: #fb923c; }
        .neutral { fill: #1e293b; stroke: #94a3b8; }
        .channel { fill: #713f12; stroke: #facc15; }
        .flow, .provision { stroke: #94a3b8; }
        .asset-flow { stroke: #a78bfa; }
        .truth-line { stroke: #4ade80; }
        .arrow-head { fill: #94a3b8; }
        .arrow-head-purple { fill: #a78bfa; }
      }
    </style>
  </defs>

  <text x="700" y="38" class="title" text-anchor="middle">Open Prospector system context</text>

  <rect x="28" y="66" width="174" height="62" rx="8" class="neutral"/>
  <text x="115" y="92" class="label">People and institutions</text>
  <text x="115" y="112" class="small">teams · authority · public</text>

  <rect x="242" y="66" width="174" height="62" rx="8" class="neutral"/>
  <text x="329" y="92" class="label">Application clients</text>
  <text x="329" y="112" class="small">game · operations · replay</text>

  <rect x="456" y="66" width="174" height="62" rx="8" class="mission"/>
  <text x="543" y="92" class="label">API and identity</text>
  <text x="543" y="112" class="small">roles · sessions · authorization</text>

  <path d="M202 97 H242" class="flow"/>
  <path d="M416 97 H456" class="flow"/>
  <path d="M543 128 V144 H44 V253 H62" class="flow"/>

  <rect x="28" y="160" width="690" height="486" rx="12" class="group"/>
  <text x="52" y="188" class="group-title">Mission-control and Institute side</text>

  <rect x="62" y="218" width="182" height="70" rx="8" class="mission"/>
  <text x="153" y="247" class="label">Campaign and mission</text>
  <text x="153" y="268" class="small">budgets · grants · shared clock</text>

  <rect x="280" y="218" width="182" height="70" rx="8" class="mission"/>
  <text x="371" y="247" class="label">Directive pipeline</text>
  <text x="371" y="268" class="small">confirmed intent · workflow</text>

  <rect x="498" y="218" width="182" height="70" rx="8" class="mission"/>
  <text x="589" y="247" class="label">Public gatekeeper</text>
  <text x="589" y="268" class="small">deterministic law · citations</text>

  <path d="M244 253 H280" class="flow"/>
  <path d="M462 253 H498" class="flow"/>

  <rect x="62" y="356" width="182" height="70" rx="8" class="mission"/>
  <text x="153" y="385" class="label">Simulation orchestrator</text>
  <text x="153" y="406" class="small">runs · checkpoints · replay</text>

  <rect x="498" y="356" width="182" height="70" rx="8" class="mission"/>
  <text x="589" y="385" class="label">Received belief</text>
  <text x="589" y="406" class="small">delivered observations only</text>

  <rect x="280" y="492" width="220" height="82" rx="8" class="record"/>
  <text x="390" y="522" class="label">Tier-1 operational record</text>
  <text x="390" y="543" class="small">append-only · hash-chained</text>
  <text x="390" y="560" class="small">accountable decision events</text>

  <rect x="534" y="492" width="146" height="82" rx="8" class="neutral"/>
  <text x="607" y="522" class="label">Corpus</text>
  <text x="607" y="543" class="small">telemetry</text>
  <text x="607" y="560" class="small">qualification · research</text>

  <path d="M390 288 V492" class="flow"/>
  <path d="M589 288 V320 H475 V492" class="flow"/>
  <path d="M589 426 V462 H500 V492" class="flow"/>
  <path d="M500 533 H534" class="flow"/>

  <rect x="736" y="218" width="126" height="208" rx="10" class="channel"/>
  <text x="799" y="270" class="label">Latency and</text>
  <text x="799" y="290" class="label">bandwidth</text>
  <text x="799" y="330" class="small">directives →</text>
  <text x="799" y="352" class="small">← status · evidence</text>
  <text x="799" y="390" class="small">Tier 1 / Tier 2</text>

  <path d="M680 253 H736" class="flow"/>
  <path d="M736 385 H704 V391 H680" class="flow"/>

  <rect x="880" y="160" width="492" height="486" rx="12" class="group"/>
  <text x="904" y="188" class="group-title">Asset side — planning and judgment stay local</text>

  <rect x="914" y="218" width="190" height="70" rx="8" class="asset"/>
  <text x="1009" y="247" class="label">Fleet endpoint</text>
  <text x="1009" y="268" class="small">directive-level contract</text>

  <rect x="1144" y="218" width="190" height="70" rx="8" class="asset"/>
  <text x="1239" y="247" class="label">Local autonomy</text>
  <text x="1239" y="268" class="small">plan · contest · safe state</text>

  <rect x="1144" y="356" width="190" height="70" rx="8" class="asset"/>
  <text x="1239" y="385" class="label">Asset belief</text>
  <text x="1239" y="406" class="small">observations · uncertainty</text>

  <rect x="914" y="356" width="190" height="70" rx="8" class="asset"/>
  <text x="1009" y="385" class="label">Body and sensors</text>
  <text x="1009" y="406" class="small">simulated now · physical later</text>

  <path d="M862 253 H914" class="asset-flow"/>
  <path d="M1104 253 H1144" class="asset-flow"/>
  <path d="M1239 288 V356" class="asset-flow"/>
  <path d="M1144 391 H1104" class="asset-flow"/>
  <path d="M1009 356 V306 H1239 V288" class="asset-flow"/>
  <path d="M914 278 H882 V402 H862" class="asset-flow"/>

  <rect x="914" y="492" width="420" height="110" rx="8" class="sim"/>
  <text x="1124" y="521" class="label">Rung-0 simulation boundary</text>
  <text x="1124" y="544" class="small">Frozen authored truth is visible only to the simulated body and sensors.</text>
  <text x="1124" y="565" class="small">Rungs 1–3 have a physical world, not a ground-truth database.</text>
  <text x="1124" y="584" class="small">Every truth-to-belief crossing creates an observation.</text>
  <path d="M1009 492 V426" class="truth-line"/>

  <path d="M244 391 H688 V620 H1009 V426" class="provision"/>
  <text x="598" y="612" class="edge-label">provisions simulated endpoint; does not send a plan</text>

  <rect x="880" y="690" width="206" height="72" rx="8" class="neutral"/>
  <text x="983" y="719" class="label">Scene projection</text>
  <text x="983" y="740" class="small">observer-scoped manifest</text>

  <rect x="1124" y="672" width="210" height="62" rx="8" class="neutral"/>
  <text x="1229" y="699" class="label">Interactive renderer</text>
  <text x="1229" y="719" class="small">real-time experience</text>

  <rect x="1124" y="752" width="210" height="62" rx="8" class="neutral"/>
  <text x="1229" y="779" class="label">Blender worker</text>
  <text x="1229" y="799" class="small">reproducible review renders</text>

  <path d="M589 426 V664 H983 V690" class="flow"/>
  <path d="M1086 712 H1124" class="flow"/>
  <path d="M1086 740 H1104 V783 H1124" class="flow"/>

  <text x="390" y="817" class="edge-label">Mission control sends intent. The asset plans, judges, acts, and reports.</text>
</svg>
